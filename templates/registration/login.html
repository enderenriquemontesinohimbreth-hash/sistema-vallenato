{% extends 'base.html' %}
{% block content %}
<section class="form-panel">
<h1>Iniciar sesión</h1>
<p>Ingresa con tu cuenta de prueba.</p>
<form method="post">
  {% csrf_token %}{% include 'registration/_form.html' %}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <button class="btn btn-primary" type="submit">Ingresar</button>
</form>
<p class="mt-3"><a href="{% url 'registro' %}">Crear una cuenta</a></p>
</section>
{% endblock %}
