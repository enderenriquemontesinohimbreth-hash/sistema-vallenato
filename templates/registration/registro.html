{% extends 'base.html' %}
{% block content %}
<section class="form-panel">
<h1>Crear cuenta</h1>
<p>Cuenta de prueba. El registro no acredita elegibilidad para votar.</p>
<form method="post">
  {% csrf_token %}{% include 'registration/_form.html' %}
  <button class="btn btn-primary" type="submit">Crear cuenta</button>
</form>
<p class="mt-3">¿Ya tienes cuenta? <a href="{% url 'login' %}">Iniciar sesión</a></p>
</section>
{% endblock %}
