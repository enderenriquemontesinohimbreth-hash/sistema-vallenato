{% if form.errors %}<div class="alert alert-danger" role="alert">Revisa los campos indicados.</div>{% endif %}
{{ form.non_field_errors }}
{% for field in form %}
<div class="mb-3">
  {{ field.label_tag }}
  {{ field }}
  {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
{% endfor %}
